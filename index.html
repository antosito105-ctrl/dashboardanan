<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Parfum - Sync System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .status-done { opacity: 0.5; background-color: #f8fafc !important; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="loader" class="loading-overlay flex-col gap-4">
        <i class="fas fa-circle-notch fa-spin text-4xl text-blue-600"></i>
        <p class="font-bold text-slate-700" id="loaderText">Sinkronisasi...</p>
    </div>

    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-3xl shadow-sm">
            <div>
                <h1 class="text-2xl font-black text-slate-800">Order Parfum 📦</h1>
                <p class="text-slate-500 text-sm">Full Control: Tambah, Hapus & Status Otomatis</p>
            </div>
            <button onclick="ambilData()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-2xl flex items-center gap-2 font-bold transition-all shadow-lg shadow-blue-200">
                <i class="fas fa-sync-alt"></i> Sinkron Data
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Form -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 h-fit">
                <h2 class="font-bold text-slate-800 mb-6 flex items-center gap-2">
                    <i class="fas fa-plus-circle text-blue-500"></i> Pesanan Baru
                </h2>
                <div class="space-y-4">
                    <input type="text" id="nama" placeholder="Nama Pembeli" class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 border-none">
                    <input type="text" id="wa" placeholder="Nomor WA" class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 border-none">
                    <input type="text" id="produk" placeholder="Nama Produk" class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 border-none">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="tgl" class="p-4 bg-slate-50 rounded-2xl text-sm border-none">
                        <select id="kurir" class="p-4 bg-slate-50 rounded-2xl text-sm border-none">
                            <option value="JNE">JNE</option>
                            <option value="J&T">J&T</option>
                            <option value="SiCepat">SiCepat</option>
                        </select>
                    </div>
                    <input type="text" id="resi" placeholder="Nomor Resi (Kunci Utama)" class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 border-none font-mono">
                    <button onclick="simpanData()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold hover:bg-blue-700 shadow-md">Simpan ke Sheets</button>
                </div>
            </div>

            <!-- List -->
            <div class="lg:col-span-2 bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="p-6 border-b border-slate-50 flex justify-between items-center">
                    <h2 class="font-bold text-slate-800 text-lg">Daftar Pengiriman</h2>
                    <span id="counter" class="bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-xs font-bold">0 Order</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full" id="tabelData">
                        <thead class="bg-slate-50 text-[10px] uppercase font-bold text-slate-400">
                            <tr>
                                <th class="p-6 text-left">Pembeli</th>
                                <th class="p-6 text-left">Produk & Resi</th>
                                <th class="p-6 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // GANTI INI DENGAN URL WEB APP BARU SETELAH DEPLOY ULANG
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwIKfzSm-h0dwjclaP3p3aOguRVyWkxt_5AbS2UtZf15-ZfkYfBp4fD37XIPKDjzzVHFg/exec';

        function loading(show, text = "") {
            document.getElementById('loader').style.display = show ? 'flex' : 'none';
            if(text) document.getElementById('loaderText').innerText = text;
        }

        async function ambilData() {
            loading(true, "Mengambil data...");
            try {
                const res = await fetch(`${WEB_APP_URL}?action=read&_=${new Date().getTime()}`);
                const data = await res.json();
                render(data);
            } catch (e) {
                console.error(e);
            } finally {
                loading(false);
            }
        }

        async function simpanData() {
            const payload = {
                action: 'create',
                nama: document.getElementById('nama').value,
                wa: document.getElementById('wa').value,
                produk: document.getElementById('produk').value,
                tgl: document.getElementById('tgl').value,
                ekspedisi: document.getElementById('kurir').value,
                resi: document.getElementById('resi').value,
                selesai: false
            };

            if(!payload.nama || !payload.resi) return alert("Nama & Resi Wajib Isi!");

            loading(true, "Menyimpan...");
            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            
            setTimeout(() => {
                alert("Data Tersimpan!");
                ambilData();
                ['nama','wa','produk','resi'].forEach(id => document.getElementById(id).value = '');
            }, 2000);
        }

        async function hapusData(resi) {
            if(!confirm("Yakin hapus? Data di spreadsheet juga akan hilang.")) return;
            loading(true, "Menghapus...");
            await fetch(WEB_APP_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ action: 'delete', resi: String(resi) }) 
            });
            setTimeout(() => {
                alert("Terhapus!");
                ambilData();
            }, 2000);
        }

        async function toggleSelesai(resi, statusSekarang) {
            loading(true, "Update status...");
            await fetch(WEB_APP_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ action: 'update', resi: String(resi), selesai: !statusSekarang }) 
            });
            setTimeout(ambilData, 2000);
        }

        function render(data) {
            const container = document.querySelector('#tabelData tbody');
            document.getElementById('counter').innerText = `${data.length} Order`;
            container.innerHTML = '';
            
            data.filter(item => item.resi).forEach(item => {
                const isDone = String(item.selesai).toLowerCase() === 'true';
                container.innerHTML += `
                    <tr class="${isDone ? 'status-done' : ''}">
                        <td class="p-6">
                            <div class="font-bold text-slate-800 text-sm">${item.nama}</div>
                            <div class="text-xs text-blue-600 font-medium">${item.wa || '-'}</div>
                        </td>
                        <td class="p-6">
                            <div class="text-xs text-slate-600 font-bold">${item.produk}</div>
                            <div class="text-[10px] text-slate-400 font-mono mt-1">${item.ekspedisi} - ${item.resi}</div>
                        </td>
                        <td class="p-6 text-right">
                            <div class="flex justify-end gap-2">
                                <button onclick="toggleSelesai('${item.resi}', ${isDone})" class="w-8 h-8 rounded-lg ${isDone ? 'bg-orange-100 text-orange-600' : 'bg-green-100 text-green-600'} flex items-center justify-center">
                                    <i class="fas ${isDone ? 'fa-undo' : 'fa-check'} text-xs"></i>
                                </button>
                                <button onclick="hapusData('${item.resi}')" class="w-8 h-8 rounded-lg bg-red-100 text-red-600 flex items-center justify-center">
                                    <i class="fas fa-trash text-xs"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        document.getElementById('tgl').valueAsDate = new Date();
        window.onload = ambilData;
    </script>
</body>
</html>
