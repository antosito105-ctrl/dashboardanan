<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Parfum - Sync System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .status-done { opacity: 0.5; background-color: #f8fafc !important; }
        input, select { transition: all 0.2s; }
        input:focus { transform: translateY(-1px); }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Loader Overlay -->
    <div id="loader" class="loading-overlay flex-col gap-4">
        <i class="fas fa-circle-notch fa-spin text-4xl text-blue-600"></i>
        <p class="font-bold text-slate-700" id="loaderText">Sinkronisasi...</p>
    </div>

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-3xl shadow-sm gap-4">
            <div>
                <h1 class="text-2xl font-black text-slate-800">Order Parfum 📦</h1>
                <p class="text-slate-500 text-sm">Full Control: Tambah, Hapus & Status Otomatis</p>
            </div>
            <button onclick="ambilData()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-2xl flex items-center justify-center gap-2 font-bold transition-all shadow-lg shadow-blue-200">
                <i class="fas fa-sync-alt"></i> Sinkron Data
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Form Section -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 h-fit">
                <h2 class="font-bold text-slate-800 mb-6 flex items-center gap-2">
                    <i class="fas fa-plus-circle text-blue-500"></i> Pesanan Baru
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 ml-2 uppercase">Nama Pembeli</label>
                        <input type="text" id="nama" placeholder="Masukkan nama..." class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 border-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 ml-2 uppercase">Nomor WA</label>
                        <input type="text" id="wa" placeholder="0812..." class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 border-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 ml-2 uppercase">Nama Produk</label>
                        <input type="text" id="produk" placeholder="Contoh: Blue Aqua 50ml" class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 border-none">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 ml-2 uppercase">Tanggal</label>
                            <input type="date" id="tgl" class="w-full p-4 bg-slate-50 rounded-2xl text-sm border-none">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 ml-2 uppercase">Ekspedisi</label>
                            <select id="kurir" class="w-full p-4 bg-slate-50 rounded-2xl text-sm border-none">
                                <option value="JNE">JNE</option>
                                <option value="J&T">J&T</option>
                                <option value="SiCepat">SiCepat</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 ml-2 uppercase">Nomor Resi</label>
                        <input type="text" id="resi" placeholder="Masukkan resi..." class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 border-none font-mono">
                    </div>
                    <button id="btnSimpan" onclick="simpanData()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold hover:bg-blue-700 shadow-md transition-all">
                        <i class="fas fa-save mr-2"></i>Simpan ke Sheets
                    </button>
                </div>
            </div>

            <!-- List Section -->
            <div class="lg:col-span-2 bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="p-6 border-b border-slate-50 flex justify-between items-center">
                    <h2 class="font-bold text-slate-800 text-lg">Daftar Pesanan</h2>
                    <span id="counter" class="bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-xs font-bold">0 Order</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full" id="tabelData">
                        <thead class="bg-slate-50 text-[10px] uppercase font-bold text-slate-400">
                            <tr>
                                <th class="p-6 text-left">Pembeli</th>
                                <th class="p-6 text-left">Produk & Resi</th>
                                <th class="p-6 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
                <div id="emptyState" class="p-20 text-center text-slate-400 hidden">
                    <i class="fas fa-box-open text-4xl mb-4 opacity-20"></i>
                    <p>Belum ada data pesanan.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // URL WEB APP TERBARU
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyopbuK8Owl2jovPzvhmuJ-De7WqD6owAXjlve-CJwVhkXRcwHbIhiOY1qvC6D7RceiYw/exec';

        function loading(show, text = "") {
            const loader = document.getElementById('loader');
            loader.style.display = show ? 'flex' : 'none';
            if(text) document.getElementById('loaderText').innerText = text;
        }

        async function ambilData() {
            loading(true, "Mengambil data terbaru...");
            try {
                const res = await fetch(`${WEB_APP_URL}?action=read&_=${Date.now()}`);
                const data = await res.json();
                render(data);
            } catch (e) {
                console.error("Fetch Error:", e);
                // Custom Toast/Notification instead of Alert can be added here
            } finally {
                loading(false);
            }
        }

        async function simpanData() {
            const btn = document.getElementById('btnSimpan');
            const payload = {
                action: 'create',
                nama: document.getElementById('nama').value.trim(),
                wa: document.getElementById('wa').value.trim(),
                produk: document.getElementById('produk').value.trim(),
                tgl: document.getElementById('tgl').value,
                ekspedisi: document.getElementById('kurir').value,
                resi: document.getElementById('resi').value.trim(),
                selesai: false
            };

            if(!payload.nama || !payload.resi) return alert("Nama dan Resi tidak boleh kosong!");

            btn.disabled = true;
            loading(true, "Mengirim data...");
            
            try {
                await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify(payload) 
                });
                
                // Delay agar Google Script selesai memproses di background
                setTimeout(() => {
                    ambilData();
                    ['nama','wa','produk','resi'].forEach(id => document.getElementById(id).value = '');
                    btn.disabled = false;
                }, 2000);
            } catch (e) {
                btn.disabled = false;
                loading(false);
                alert("Terjadi kesalahan saat menyimpan.");
            }
        }

        async function hapusData(resi) {
            if(!confirm(`Hapus data dengan resi ${resi}?`)) return;
            
            loading(true, "Menghapus dari database...");
            try {
                await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify({ action: 'delete', resi: String(resi).trim() }) 
                });
                
                setTimeout(ambilData, 2000);
            } catch (e) {
                loading(false);
                alert("Gagal menghapus.");
            }
        }

        async function toggleSelesai(resi, statusSekarang) {
            loading(true, "Memperbarui status...");
            try {
                await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify({ action: 'update', resi: String(resi).trim(), selesai: !statusSekarang }) 
                });
                setTimeout(ambilData, 1500);
            } catch (e) {
                loading(false);
            }
        }

        function render(data) {
            const container = document.querySelector('#tabelData tbody');
            const emptyState = document.getElementById('emptyState');
            
            // Filter hanya data yang benar-benar ada isinya (mencegah bug baris kosong)
            const validData = data.filter(item => item.nama && item.resi);
            
            document.getElementById('counter').innerText = `${validData.length} Order`;
            container.innerHTML = '';
            
            if (validData.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                validData.forEach(item => {
                    const isDone = String(item.selesai).toUpperCase() === 'TRUE';
                    container.innerHTML += `
                        <tr class="${isDone ? 'status-done' : ''} border-b border-slate-50 hover:bg-slate-50/50 transition-colors">
                            <td class="p-6">
                                <div class="font-bold text-slate-800 text-sm">${item.nama}</div>
                                <div class="text-xs text-blue-600 font-medium">${item.wa || '-'}</div>
                            </td>
                            <td class="p-6">
                                <div class="text-xs text-slate-600 font-bold">${item.produk}</div>
                                <div class="text-[10px] text-slate-400 font-mono mt-1">${item.ekspedisi} - ${item.resi}</div>
                            </td>
                            <td class="p-6 text-right">
                                <div class="flex justify-end gap-2">
                                    <button onclick="toggleSelesai('${item.resi}', ${isDone})" title="Tandai Selesai" class="w-9 h-9 rounded-xl ${isDone ? 'bg-orange-100 text-orange-600' : 'bg-green-100 text-green-600'} flex items-center justify-center hover:scale-110 active:scale-95 transition-all">
                                        <i class="fas ${isDone ? 'fa-undo' : 'fa-check'} text-xs"></i>
                                    </button>
                                    <button onclick="hapusData('${item.resi}')" title="Hapus" class="w-9 h-9 rounded-xl bg-red-100 text-red-600 hover:bg-red-600 hover:text-white flex items-center justify-center hover:scale-110 active:scale-95 transition-all">
                                        <i class="fas fa-trash text-xs"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
            }
        }

        // Set default date ke hari ini
        document.getElementById('tgl').valueAsDate = new Date();
        // Ambil data saat halaman dibuka
        window.onload = ambilData;
    </script>
</body>
</html>
